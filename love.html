<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 1st Anniversary 💗</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="love.css">
</head>

<body>

<div class="hearts"></div>
<div class="fireworks"></div>

<div class="envelope" id="envelope">

  <div class="flap"></div>

  <div class="letter">

    <div class="kitty">
      🎀🐱💗
    </div>

    <h1>Happy 1st Anniversary</h1>
    <p class="subtitle">สำหรับคนที่เค้ารักที่สุด</p>

    <div id="typeText" class="typeText"></div>

    <div class="sparkles">✨ 💖 ✨ 💗 ✨</div>

    <button class="backBtn" onclick="history.back()">← กลับหน้าก่อน</button>

  </div>

</div>

<script>
// เปิดซอง
setTimeout(()=>{
document.getElementById("envelope").classList.add("open");
},600);

// พิมพ์ข้อความ
const message=`เค้ารักอ้วนมากๆเลยนะอ้วนรู้บ้างมั้ย

บางทีเค้าอาจจะคิดเล็กคิดน้อย
จนทำให้อ้วนอึดอัด

แต่ทุกอย่างที่เค้าเป็น
เพราะเค้ารักอ้วนที่สุด

เธอจะเป็นของเค้าไปเรื่อยๆ
ตราบใดที่เรายังเลือกกันอยู่

ขอบคุณที่อยู่กับเค้ามาจนครบ 1 ปี

Happy 1st Anniversary, Field.
I love you the most. 💗`;

const box=document.getElementById("typeText");
let i=0;

function typing(){
if(i<message.length){
box.innerHTML+=message[i]=="\n"?"<br>":message[i];
i++;
setTimeout(typing,32);
}
}
setTimeout(typing,1300);

// หัวใจลอย
const hearts=document.querySelector(".hearts");

setInterval(()=>{
const h=document.createElement("span");
h.innerHTML=Math.random()>0.5?"💗":"💖";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(18+Math.random()*24)+"px";
h.style.animationDuration=(3+Math.random()*3)+"s";
hearts.appendChild(h);
setTimeout(()=>h.remove(),6000);
},220);

// พลุ
const fw=document.querySelector(".fireworks");

setInterval(()=>{
const f=document.createElement("div");
f.className="boom";
f.style.left=Math.random()*100+"vw";
f.style.top=Math.random()*75+"vh";
fw.appendChild(f);
setTimeout(()=>f.remove(),1000);
},700);
</script>

</body>
</html>
